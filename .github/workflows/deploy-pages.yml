# Personal deployment to GitHub Pages: every push to main is tested, built and published; can also be run by hand.
# One-time setup: Settings › Pages › Source: "GitHub Actions" (and main as the default branch).
# Host-specific files (.nojekyll) are added here, not in the application (host neutrality, revision 3).
# Build configuration (incl. the public Google OAuth client id) lives in .env.production.
name: Deploy (GitHub Pages)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      # Configuration comes from the committed .env.production (public values only).
      - run: npm run build
      - run: touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
